<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Valley</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; height: 100%; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #err { position: fixed; left: 8px; top: 8px; color: #f66; font: 14px monospace; white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="err"></div>
<script>
  window.addEventListener("error", function (e) {
    document.getElementById("err").textContent += (e.message || e) + "\n";
  });
  window.addEventListener("unhandledrejection", function (e) {
    document.getElementById("err").textContent += String(e.reason && e.reason.stack || e.reason) + "\n";
  });
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
